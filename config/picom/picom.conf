backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true; 

shadow = true;
shadow-radius = 10;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.6;

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'slock'",
    "class_g = 'Dunst'"
];

corner-radius = 10;

rounded-corners-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'slock'",
    "class_g = 'Dunst'"
];

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

blur-background-exclude = [
    "class_g = 'slock'"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [];

active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;
inactive-opacity-override = false;